name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 推送到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages base path
        run: |
          # 项目页部署在 /<repo>/ 下，构建时把 base 设为仓库名
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "VITE_BASE=/${REPO_NAME}/" >> "$GITHUB_ENV"
          echo "Deploying to /${REPO_NAME}/"

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 若仓库尚未启用 Pages，则自动启用（使用 GitHub Actions 作为构建源）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
